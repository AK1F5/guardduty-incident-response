name: Verify incident workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.42.70 cfn-lint==1.47.0
      - run: python -m unittest discover -s tests -v
      - run: cfn-lint template.yaml
      - run: python incident.py demo
      - run: python package_lambda.py
